name: Release

# 自动发布发行版：推送形如 v1.0.1 的 tag 时触发，
# 在 GitHub 云端用 JDK 21 自动构建插件 jar，并创建 GitHub Release 上传产物。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: chmod +x gradlew && ./gradlew build -x test --no-daemon

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/libs/*.jar
          # 发行说明：随 tag 一并提交的简版说明（面向普通用户），末尾不带任何链接块。
          # 不启用自动生成（generate_release_notes）——GitHub 会在末尾附加
          # 「Full Changelog」对比链接，用户偏好不需要。
          body_path: .github/release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
